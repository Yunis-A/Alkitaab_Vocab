# Builds the React app in web/ and publishes it with GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_BASE: /${{ github.event.repository.name }}/
      # Both are public by design (they end up in the browser bundle); access is enforced by row-level security.
      VITE_SUPABASE_URL: https://lgqozdydxmybzwykjsmn.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_H5H9sbMXd9NDCb7On7oG6w__Ez1RlLF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Pages has no server-side routing: unknown paths (e.g. /lookup on refresh) get index.html via 404.html.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
