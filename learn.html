<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn — Al-Kitaab Adaptive Learning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="site-title"></h1>
    <div class="controls">
      <div>
        <label id="label-book" for="book">Book:</label>
        <select id="book">
          <option value="1">Alif Baa</option>
          <option value="2">الكتاب ١</option>
          <option value="3">الكتاب ٢</option>
          <option value="4">الكتاب ٣</option>
        </select>
      </div>
      <div>
        <label id="label-unit" for="unit">Unit:</label>
        <select id="unit"></select>
      </div>
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="home.html" id="nav-home" data-page="home"></a></li>
      <li><a href="learn.html" id="nav-learn" data-page="learn"></a></li>
      <li><a href="lookup.html" id="nav-lookup" data-page="lookup"></a></li>
      <li><a href="quiz.html" id="nav-quiz" data-page="quiz"></a></li>
      <li><a href="grammar.html" id="nav-grammar" data-page="grammar"></a></li>
    </ul>
  </nav>

  <main>
    <section class="card">
      <div class="session-meta">
        <span id="learn-scope"></span>
        <span id="learn-progress"></span>
      </div>
      <div class="controls" style="margin-top:0;margin-bottom:12px">
        <div>
          <label id="label-direction" for="card-direction"></label>
          <select id="card-direction">
            <option value="ar-en">Arabic → English</option>
            <option value="en-ar">English → Arabic</option>
          </select>
        </div>
        <div>
          <label id="label-learn-scope" for="learn-scope-select"></label>
          <select id="learn-scope-select">
            <option value="unit">Current unit</option>
            <option value="book">Current book</option>
            <option value="all">All unlocked</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card flashcard" id="flashcard" hidden>
      <div class="prompt" id="card-prompt"></div>
      <div class="answer" id="card-answer" hidden></div>
      <p class="hint" id="card-hint"></p>
    </section>

    <section class="card" id="learn-empty" hidden>
      <p id="learn-empty-msg"></p>
    </section>

    <section class="card" id="learn-done" hidden>
      <h2 id="session-done-title"></h2>
      <div class="btn-row">
        <a class="btn" href="home.html" id="btn-back-home">Home</a>
        <button type="button" class="btn secondary" id="btn-restart">Restart</button>
      </div>
    </section>

    <div class="btn-row" id="reveal-row" hidden>
      <button type="button" class="btn" id="btn-reveal"></button>
    </div>

    <div class="btn-row" id="rating-row" hidden>
      <button type="button" class="btn btn-again" id="btn-again" data-rating="again"></button>
      <button type="button" class="btn btn-hard" id="btn-hard" data-rating="hard"></button>
      <button type="button" class="btn btn-good" id="btn-good" data-rating="good"></button>
      <button type="button" class="btn btn-easy" id="btn-easy" data-rating="easy"></button>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/data.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/learn.js"></script>
</body>
</html>
